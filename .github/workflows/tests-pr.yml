# PR Tests - Roda em Pull Requests
#
# Executa testes de unidade e integração (exceto smoke/contract/schema
# que já rodam no pre-commit hook local).
#
# Fluxo de testes:
#   - Local (pre-commit): smoke, contract, schema (~30s)
#   - PR (este workflow):  unit, integration (~5min)
#   - PR (tests-e2e.yml):  E2E Playwright (~15min)

name: PR Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pr-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synthlab
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: |
          cd src/synth_lab/alembic
          alembic upgrade head

      - name: Seed test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: |
          python tests/fixtures/seed_test.py

      - name: Run unit and integration tests (excluding smoke/contract/schema)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest tests/ -v --tb=short \
            -m "not (smoke or contract or schema)" \
            --cov=src/synth_lab \
            --cov-report=term \
            --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
