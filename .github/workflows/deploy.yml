# Deploy Production - Manual Trigger Only
#
# Flow: Promote staging-verified images → Deploy → Smoke Tests → Tag as production
#
# Uses "Build Once, Deploy Anywhere" pattern:
#   - Deploys the SAME images that were tested in staging
#   - Images tagged :staging-verified are promoted to production
#   - No rebuild = guaranteed identical deployment
#
# IMPORTANT: This is a MANUAL workflow. Deploy to production requires explicit confirmation.
#
# Usage:
#   1. Go to Actions → Deploy Production
#   2. Click "Run workflow"
#   3. Type "deploy" in the confirmation input
#   4. Click "Run workflow" button

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string
      image_tag:
        description: 'Image tag to deploy (default: staging-verified)'
        required: false
        default: 'staging-verified'
        type: string

env:
  REGISTRY: ghcr.io
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  # ============================================================================
  # Stage 0: Validate Confirmation Input
  # ============================================================================
  validate-confirmation:
    name: Validate Confirmation
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}

    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "deploy" ]; then
            echo "❌ ERROR: Invalid confirmation. You must type exactly 'deploy' to proceed."
            echo "You typed: '${{ github.event.inputs.confirmation }}'"
            exit 1
          fi
          echo "✅ Confirmation validated. Proceeding with production deployment..."

      - name: Set image tag
        id: set-tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using image tag: $TAG"

  # ============================================================================
  # Stage 1: Verify Images Exist
  # ============================================================================
  verify-images:
    name: Verify Images
    runs-on: ubuntu-latest
    needs: validate-confirmation
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify backend image exists
        run: |
          echo "Checking backend image..."
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.validate-confirmation.outputs.image_tag }}
          echo "✅ Backend image found"

      - name: Verify frontend image exists
        run: |
          echo "Checking frontend image..."
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.validate-confirmation.outputs.image_tag }}
          echo "✅ Frontend image found"

      - name: Image verification summary
        run: |
          echo "## Images Verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.validate-confirmation.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.validate-confirmation.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 2: Run Migrations on Production DB
  # ============================================================================
  migrate-production:
    name: Migrate Production DB
    runs-on: ubuntu-latest
    needs: verify-images

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run Alembic migrations on Production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PRODUCTION_URL }}
        run: |
          echo "Running migrations on Production database..."
          cd src/synth_lab/alembic
          alembic upgrade head
          echo "✅ Production migrations completed"

  # ============================================================================
  # Stage 3: Deploy Images to Railway Production
  # ============================================================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [validate-confirmation, migrate-production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-api \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.validate-confirmation.outputs.image_tag }}" \
            production

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [validate-confirmation, deploy-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-frontend \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.validate-confirmation.outputs.image_tag }}" \
            production

      - name: Wait for deployments to stabilize
        run: sleep 120  # Wait 2 minutes for both services to deploy

  # ============================================================================
  # Stage 4: Smoke Tests on Production
  # ============================================================================
  verify-production:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on Production
        run: make test-smoke-production

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Stage 5: Tag Images as Production
  # ============================================================================
  tag-production:
    name: Tag Production Images
    runs-on: ubuntu-latest
    needs: [validate-confirmation, verify-production]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as production
        run: |
          SOURCE_TAG="${{ needs.validate-confirmation.outputs.image_tag }}"

          # Pull and re-tag backend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:$SOURCE_TAG
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:$SOURCE_TAG \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:production
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:$SOURCE_TAG \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:production
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:latest

          # Pull and re-tag frontend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:$SOURCE_TAG
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:$SOURCE_TAG \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:production
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:$SOURCE_TAG \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:latest
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:production
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:latest

          echo "✅ Images tagged as production and latest"

  # ============================================================================
  # Notify on completion
  # ============================================================================
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [validate-confirmation, verify-production, tag-production]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag**: \`${{ needs.validate-confirmation.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.verify-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Flow" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Validate confirmation" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Verify images exist in GHCR" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Migrate Production DB (Alembic)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Deploy Backend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Deploy Frontend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Smoke Tests on Production" >> $GITHUB_STEP_SUMMARY
          echo "7. ✅ Tag Images as production/latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:production" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:production" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://synth-lab-frontend-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: https://synth-lab-api-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.verify-production.result }}" == "success" ]; then
            echo "✅ Production deployment successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Production deployment failed. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
