# Deploy Workflow - Triggered on new tags
#
# Flow: Tag → Migrate Production → Deploy Production → Smoke Tests
#
# Usage:
#   git tag -a v1.0.0 -m "Release 1.0.0"
#   git push origin v1.0.0

name: Deploy

on:
  push:
    tags:
      - 'v*'  # Dispara em tags como v1.0.0, v2.3.1, etc.

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # ============================================================================
  # Stage 1: Run Migrations on Production
  # ============================================================================
  migrate-production:
    name: Migrate Production DB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run Alembic migrations on Production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PRODUCTION_URL }}
        run: |
          echo "Running migrations on Production database..."
          cd src/synth_lab/alembic
          alembic upgrade head
          echo "✅ Production migrations completed"

  # ============================================================================
  # Stage 2: Deploy to Production
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: migrate-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service synth-lab-api --environment production --detach

      - name: Deploy Frontend to Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service synth-lab-frontend --environment production --detach

      - name: Wait for deployments to be ready
        run: sleep 60  # Aguarda 60s para os serviços estabilizarem

  # ============================================================================
  # Stage 3: Smoke Tests on Production
  # ============================================================================
  verify-production:
    name: Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on Production
        continue-on-error: true  # TODO: Remove after E2E tests are fixed
        working-directory: frontend
        run: npm run test:e2e:production -- smoke/
        env:
          TEST_ENV: production

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Notify on completion
  # ============================================================================
  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: verify-production
    if: always()

    steps:
      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ steps.tag.outputs.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.verify-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Flow" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Migrate Production DB (Alembic)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Deploy to Production" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Smoke Tests on Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Production**: https://synth-lab-frontend-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
