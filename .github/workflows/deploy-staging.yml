# Deploy Staging - Automatic on main push
#
# Flow: Build Images → [Tests if direct push] → Reset DB → Migrate → Seed → Deploy → Smoke Tests
#
# Uses "Build Once, Deploy Anywhere" pattern:
#   1. Build Docker images and push to GHCR
#   2. Run full tests IF direct push (not from PR merge) - avoids redundancy
#   3. Deploy the SAME images to Railway staging
#   4. Run smoke tests to validate deploy
#
# The same images can then be promoted to production.
#
# IMPORTANT: Staging database is EPHEMERAL - it gets reset on every deploy.
# Do not store important data in staging environment.

name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  # ============================================================================
  # Stage 1: Build and Push Docker Images
  # ============================================================================
  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.backend-meta.outputs.tags }}
      frontend_image: ${{ steps.frontend-meta.outputs.tags }}
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend Image
      - name: Extract backend metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api
          tags: |
            type=sha,prefix=
            type=raw,value=staging

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image
      - name: Extract frontend metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend
          tags: |
            type=sha,prefix=
            type=raw,value=staging

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ vars.STAGING_BACKEND_URL }}

      - name: Output build summary
        run: |
          echo "## Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 1.5: Run Full Tests (ONLY if direct push, not PR merge)
  # These tests already ran in PR, so skip if this is a merge commit
  # ============================================================================
  backend-tests:
    name: Backend Tests (direct push only)
    runs-on: ubuntu-latest
    needs: build-images
    # Only run if NOT a PR merge (PR merges have "Merge pull request" in commit message)
    if: ${{ !contains(github.event.head_commit.message, 'Merge pull request') }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synthlab
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: |
          cd src/synth_lab/alembic
          alembic upgrade head

      - name: Seed test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: python tests/fixtures/seed_test.py

      - name: Run all backend tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/ -v --tb=short

  e2e-tests:
    name: E2E Tests (direct push only)
    runs-on: ubuntu-latest
    needs: build-images
    # Only run if NOT a PR merge
    if: ${{ !contains(github.event.head_commit.message, 'Merge pull request') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start E2E environment with built images
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BACKEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.build-images.outputs.image_tag }} \
          FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.build-images.outputs.image_tag }} \
          docker compose -f docker-compose.e2e.yml up -d
          sleep 30

      - name: Wait for backend
        run: npx wait-on http://localhost:8001/health --timeout 120000

      - name: Wait for frontend
        run: npx wait-on http://localhost:8091 --timeout 120000

      - name: Run E2E tests
        working-directory: frontend
        timeout-minutes: 15
        run: TEST_ENV=docker npm run test:e2e

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ============================================================================
  # Stage 2: Reset Staging Database
  # ============================================================================
  reset-staging-db:
    name: Reset Staging DB
    runs-on: ubuntu-latest
    needs: [build-images, backend-tests, e2e-tests]
    # Always run, but wait for tests if they ran
    if: ${{ always() && needs.build-images.result == 'success' && (needs.backend-tests.result == 'success' || needs.backend-tests.result == 'skipped') && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Reset staging database (drop all tables)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
        run: |
          echo "⚠️  Resetting staging database (dropping all tables)..."
          cd src/synth_lab/alembic
          alembic downgrade base
          echo "✅ Staging database reset completed"

  # ============================================================================
  # Stage 3: Run Migrations on Staging DB
  # ============================================================================
  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    needs: reset-staging-db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run Alembic migrations on Staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
        run: |
          echo "Running migrations on Staging database..."
          cd src/synth_lab/alembic
          alembic upgrade head
          echo "✅ Staging migrations completed"

  # ============================================================================
  # Stage 4: Seed Staging Database
  # ============================================================================
  seed-staging:
    name: Seed Staging DB
    runs-on: ubuntu-latest
    needs: migrate-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Seed staging database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Seeding staging database with test data..."
          python scripts/seed_database.py
          echo "✅ Staging database seeded"

  # ============================================================================
  # Stage 5: Deploy Images to Railway Staging
  # ============================================================================
  deploy-backend:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: [build-images, seed-staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-api \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.build-images.outputs.image_tag }}" \
            staging

  deploy-frontend:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: [build-images, deploy-backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-frontend \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.build-images.outputs.image_tag }}" \
            staging

      - name: Wait for deployments to stabilize
        run: sleep 120  # Wait 2 minutes for both services to deploy

  # ============================================================================
  # Stage 6: Run Smoke Tests on Staging (deploy validation only)
  # ============================================================================
  verify-staging:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on Staging
        run: make test-smoke-staging
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Stage 7: Tag Images as Staging-Verified
  # ============================================================================
  tag-verified:
    name: Tag Verified Images
    runs-on: ubuntu-latest
    needs: [build-images, verify-staging]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as staging-verified
        run: |
          # Pull and re-tag backend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.build-images.outputs.image_tag }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.build-images.outputs.image_tag }} \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:staging-verified
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:staging-verified

          # Pull and re-tag frontend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.build-images.outputs.image_tag }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.build-images.outputs.image_tag }} \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:staging-verified
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:staging-verified

          echo "✅ Images tagged as staging-verified"

  # ============================================================================
  # Notify on completion
  # ============================================================================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-images, verify-staging, tag-verified]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Staging Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.verify-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Flow" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Build Docker Images (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Reset Staging DB (drop all tables)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Migrate Staging DB (Alembic)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Seed Staging DB (test data)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Deploy Backend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Deploy Frontend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "7. ✅ Smoke Tests (deploy validation)" >> $GITHUB_STEP_SUMMARY
          echo "8. ✅ Tag Images as staging-verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ needs.build-images.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ needs.build-images.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ vars.STAGING_FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${{ vars.STAGING_BACKEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.verify-staging.result }}" == "success" ]; then
            echo "✅ Smoke tests passed - staging deploy validated!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Ready for production**: Images tagged as \`:staging-verified\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Staging deployment or smoke tests failed. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
