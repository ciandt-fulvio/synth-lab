# Deploy Staging - Automatic on main push
#
# Two deployment modes:
#
# 1. NORMAL DEPLOY (default - on every push to main):
#    - Migrate DB (apply new migrations only)
#    - Seed DB (conditional - only if synth_groups is empty)
#    - Deploy images to Railway
#    - Run smoke tests
#
# 2. FRESH START (manual - via workflow_dispatch with fresh_start=true):
#    - Reset DB (DROP all tables)
#    - Migrate DB (recreate from scratch)
#    - Seed DB (always, since DB is empty)
#    - Deploy images to Railway
#    - Run smoke tests
#
# Usage:
#   - Normal deploy: git push origin main
#   - Fresh start: gh workflow run deploy-staging.yml -f fresh_start=true
#
# Database Management Strategy:
#   - Migrations are ADDITIVE (handled by Alembic) - safe to run multiple times
#   - Container entrypoint does NOT run migrations (workflow handles this)
#   - Seeding is CONDITIONAL (checks if synth_groups is empty first)
#
# IMPORTANT: Only use fresh start when you need to completely reset the database.
# Normal deploys should use migrations which preserve existing data.

name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fresh_start:
        description: 'Fresh start: Drop all tables and recreate from scratch'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
  IMAGE_TAG: staging

jobs:
  # ============================================================================
  # Stage 1: Reset Staging Database (Optional - Fresh Start Only)
  # ============================================================================
  # This job only runs when:
  # - Manually triggered with fresh_start=true
  # - First time deployment (no existing schema)
  #
  # For normal deploys, we skip reset and only run migrations (which are additive).
  # ============================================================================
  reset-staging-db:
    name: Reset Staging DB
    runs-on: ubuntu-latest
    # Only run reset on fresh start (manual trigger with input)
    if: github.event.inputs.fresh_start == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Reset staging database (drop all tables)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
        run: |
          echo "⚠️  Resetting staging database (dropping all tables)..."
          # Use raw SQL to drop all tables - more robust than alembic downgrade
          # which can fail if indexes/constraints are missing from partial migrations
          python -c "
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['DATABASE_URL'])
          with engine.connect() as conn:
              # Drop all tables in public schema
              conn.execute(text('DROP SCHEMA public CASCADE'))
              conn.execute(text('CREATE SCHEMA public'))
              conn.execute(text('GRANT ALL ON SCHEMA public TO PUBLIC'))
              conn.commit()
          print('✅ All tables dropped successfully')
          "
          echo "✅ Staging database reset completed"

  # ============================================================================
  # Stage 2: Run Migrations on Staging DB
  # ============================================================================
  # This job ALWAYS runs to ensure the database schema is up to date.
  # - If fresh_start=true: runs after reset
  # - If fresh_start=false: runs independently (migrations are additive)
  # ============================================================================
  migrate-staging:
    name: Migrate Staging DB
    runs-on: ubuntu-latest
    # Run after reset if fresh start, otherwise run independently
    needs: reset-staging-db
    if: always() && (needs.reset-staging-db.result == 'success' || needs.reset-staging-db.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Run Alembic migrations on Staging
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
        run: |
          echo "Running migrations on Staging database..."
          cd src/synth_lab/alembic
          alembic upgrade head
          echo "✅ Staging migrations completed"

  # ============================================================================
  # Stage 3: Seed Staging Database (ONLY if synth_groups table is empty)
  # ============================================================================
  seed-staging:
    name: Seed Staging DB
    runs-on: ubuntu-latest
    needs: migrate-staging
    # Fix transitive skip: when reset-staging-db is skipped (non-fresh_start),
    # GitHub Actions propagates the skip to all downstream jobs unless we use always()
    if: always() && needs.migrate-staging.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Seed staging database (conditional)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_STAGING_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Checking staging database and seeding if needed..."
          python scripts/seed_database.py
          echo "✅ Seed check completed"

  # ============================================================================
  # Stage 4: Deploy Images to Railway Staging
  # ============================================================================
  deploy-backend:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: seed-staging
    if: always() && needs.seed-staging.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy backend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-api \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ env.IMAGE_TAG }}" \
            staging

  deploy-frontend:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always() && needs.deploy-backend.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy frontend image to Railway
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          ./scripts/railway-deploy-image.sh \
            synth-lab-frontend \
            "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ env.IMAGE_TAG }}" \
            staging

      - name: Wait for Railway deployments to stabilize
        run: |
          echo "Waiting for Railway to pull images and start containers..."
          echo "This can take 3-5 minutes for large images..."
          sleep 180  # Wait 3 minutes for Railway to pull images and start containers
          echo "✅ Initial wait completed, now checking health endpoint..."

  # ============================================================================
  # Stage 5: Run Smoke Tests on Staging (deploy validation only)
  # ============================================================================
  verify-staging:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: always() && needs.deploy-frontend.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Railway deployment status
        continue-on-error: true
        run: |
          echo "Checking recent Railway deployments..."
          # This requires railway CLI to be installed
          # For now, we'll skip this and rely on health checks
          echo "ℹ️  Railway CLI check skipped - relying on health endpoint"

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for staging backend to be healthy..."
          echo "Testing URL: ${{ vars.STAGING_BACKEND_URL }}/health"

          # Try for up to 5 minutes (30 attempts x 10s)
          for i in {1..30}; do
            echo "Attempt $i/30: Checking backend health..."

            # Try to get health endpoint with verbose output on failure
            if curl -sf "${{ vars.STAGING_BACKEND_URL }}/health" > /dev/null 2>&1; then
              echo "✅ Backend is healthy!"
              # Show the actual response
              curl -s "${{ vars.STAGING_BACKEND_URL }}/health"
              exit 0
            else
              # On failure, show HTTP status code
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_BACKEND_URL }}/health" 2>&1 || echo "connection_failed")
              echo "  HTTP Status: $HTTP_CODE (not ready yet, waiting 10s...)"
            fi

            sleep 10
          done

          echo ""
          echo "❌ Backend did not become healthy after 5 minutes"
          echo "Last attempt details:"
          curl -v "${{ vars.STAGING_BACKEND_URL }}/health" || true
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests on Staging
        run: make test-smoke-staging
        env:
          STAGING_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
          STAGING_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Stage 6: Tag Images as Staging-Verified
  # ============================================================================
  tag-verified:
    name: Tag Verified Images
    runs-on: ubuntu-latest
    needs: verify-staging
    if: always() && needs.verify-staging.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag images as staging-verified
        run: |
          # Pull and re-tag backend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ env.IMAGE_TAG }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ env.IMAGE_TAG }} \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:staging-verified
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:staging-verified

          # Pull and re-tag frontend
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ env.IMAGE_TAG }}
          docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ env.IMAGE_TAG }} \
                     ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:staging-verified
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:staging-verified

          echo "✅ Images tagged as staging-verified"

  # ============================================================================
  # Notify on completion
  # ============================================================================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [verify-staging, tag-verified]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Staging Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.verify-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Flow" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Reset Staging DB (drop all tables)" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Migrate Staging DB (Alembic)" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ Seed Staging DB (conditional - only if empty)" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Deploy Backend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "5. ✅ Deploy Frontend Image (Railway)" >> $GITHUB_STEP_SUMMARY
          echo "6. ✅ Smoke Tests (deploy validation)" >> $GITHUB_STEP_SUMMARY
          echo "7. ✅ Tag Images as staging-verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ vars.STAGING_FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${{ vars.STAGING_BACKEND_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.verify-staging.result }}" == "success" ]; then
            echo "✅ Smoke tests passed - staging deploy validated!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Ready for production**: Images tagged as \`:staging-verified\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Staging deployment or smoke tests failed. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
