# Build and Test - Incremental Detection
#
# Detects changes since last Docker image and builds/tests only what changed.
# Runs on: pull requests to main
#
# Flow:
#   1. Detect changes (backend, frontend)
#   2. Build backend IF changed → Run full pytest
#   3. Build frontend IF changed (and backend passed)
#   4. Run E2E tests IF frontend changed (and previous steps passed)
#   5. Push images to GHCR IF all tests passed
#
# NOTE: On push to main, images are built and pushed locally via pre-push hook.
# This workflow only runs on PRs to validate changes before merge.

name: Build and Test (Incremental)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/synth-lab-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/synth-lab-frontend

jobs:
  # ============================================================================
  # Stage 1: Detect Changes
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend }}
      frontend_changed: ${{ steps.changes.outputs.frontend }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comparison

      - name: Detect changed files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile.backend'
              - 'scripts/**'
            frontend:
              - 'frontend/src/**'
              - 'frontend/tests/**'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - 'frontend/Dockerfile'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig.json'

      - name: Output detection results
        run: |
          echo "## Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ steps.changes.outputs.backend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ steps.changes.outputs.frontend }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 2: Build and Test Backend (if changed)
  # ============================================================================
  build-test-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synthlab
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    outputs:
      image_tag: ${{ github.sha }}
      image_built: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: |
          cd src/synth_lab/alembic
          alembic upgrade head

      - name: Seed test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
        run: python tests/fixtures/seed_test.py

      - name: Run all backend tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/synthlab
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pytest tests/ -v --tb=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output backend summary
        run: |
          echo "## Backend Build & Test" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image built: \`${{ env.BACKEND_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 2b: Skip Backend (if not changed)
  # ============================================================================
  skip-backend:
    name: Backend Unchanged
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'false'

    outputs:
      image_tag: ${{ github.sha }}
      image_built: 'false'

    steps:
      - name: Backend unchanged
        run: |
          echo "## Backend" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️  No changes detected - using existing image" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 3: Build Frontend (if changed and backend passed)
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-backend, skip-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      (needs.build-test-backend.result == 'success' || needs.skip-backend.result == 'success')
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}
      image_built: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:8001

      - name: Output frontend summary
        run: |
          echo "## Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image built: \`${{ env.FRONTEND_IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 3b: Skip Frontend (if not changed)
  # ============================================================================
  skip-frontend:
    name: Frontend Unchanged
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-backend, skip-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend_changed == 'false' &&
      (needs.build-test-backend.result == 'success' || needs.skip-backend.result == 'success')

    outputs:
      image_tag: ${{ github.sha }}
      image_built: 'false'

    steps:
      - name: Frontend unchanged
        run: |
          echo "## Frontend" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️  No changes detected - using existing image" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Stage 4: E2E Tests (if frontend changed and previous steps passed)
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-backend, skip-backend, build-frontend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend_changed == 'true' &&
      (needs.build-test-backend.result == 'success' || needs.skip-backend.result == 'success') &&
      needs.build-frontend.result == 'success'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start E2E environment with built images
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          docker compose -f docker-compose.e2e.yml up -d
          sleep 30

      - name: Wait for backend
        run: npx wait-on http://localhost:8001/health --timeout 120000

      - name: Wait for frontend
        run: npx wait-on http://localhost:8091 --timeout 120000

      - name: Run E2E tests
        working-directory: frontend
        timeout-minutes: 15
        run: TEST_ENV=docker npm run test:e2e

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================================================
  # Stage 5: Summary and Tag Images
  # ============================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-backend, skip-backend, build-frontend, skip-frontend, e2e-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.detect-changes.outputs.backend_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.detect-changes.outputs.frontend_changed }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Tests: ${{ needs.build-test-backend.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.build-frontend.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-test-backend.result }}" == "success" ] || [ "${{ needs.skip-backend.result }}" == "success" ]; then
            if [ "${{ needs.build-frontend.result }}" == "success" ] || [ "${{ needs.skip-frontend.result }}" == "success" ]; then
              if [ "${{ needs.e2e-tests.result }}" == "success" ] || [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
                echo "✅ All checks passed - images ready for staging deploy" >> $GITHUB_STEP_SUMMARY
                exit 0
              fi
            fi
          fi

          echo "❌ Some checks failed - review logs" >> $GITHUB_STEP_SUMMARY
          exit 1
