# E2E Tests - Triggered on Pull Requests
#
# Flow: Build Images → Push to GHCR → Run E2E Tests → Cleanup
#
# Uses "Build Once, Test Anywhere" pattern:
#   1. Build Docker images and push to GHCR with PR-specific tag
#   2. Run E2E tests against these exact images
#   3. Same images can later be promoted to staging/production
#
# This ensures E2E tests run against the EXACT same images that will be deployed.

name: E2E Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # ============================================================================
  # Build and Push Images for E2E Testing
  # ============================================================================
  build-images:
    name: Build Test Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.images.outputs.backend }}
      frontend_image: ${{ steps.images.outputs.frontend }}
      image_tag: ${{ steps.images.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: images
        run: |
          # Use PR number or SHA for tag
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
          else
            TAG="${{ github.sha }}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "backend=${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-api:$TAG" >> $GITHUB_OUTPUT
          echo "frontend=${{ env.REGISTRY }}/${{ github.repository_owner }}/synth-lab-frontend:$TAG" >> $GITHUB_OUTPUT

          echo "Using image tag: $TAG"

      # Build Backend
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.images.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://localhost:8001

      - name: Output build summary
        run: |
          echo "## Docker Images Built for E2E" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ steps.images.outputs.backend }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ steps.images.outputs.frontend }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # E2E Tests with Pre-built Images
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build-images
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js for Playwright
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Login to pull images
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Start E2E environment with pre-built images
      - name: Start E2E environment
        run: |
          echo "Starting E2E environment with pre-built images..."
          BACKEND_IMAGE=${{ needs.build-images.outputs.backend_image }} \
          FRONTEND_IMAGE=${{ needs.build-images.outputs.frontend_image }} \
          docker compose -f docker-compose.e2e.yml up -d

          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Wait for backend to be ready
        run: |
          npx wait-on http://localhost:8001/health --timeout 120000

      - name: Wait for frontend to be ready
        run: |
          npx wait-on http://localhost:8091 --timeout 120000

      - name: Run E2E tests
        working-directory: frontend
        run: TEST_ENV=docker npm run test:e2e

      # Upload Results on Failure
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      # Cleanup
      - name: Collect Docker Compose logs
        if: failure()
        run: |
          mkdir -p docker-logs
          docker compose -f docker-compose.e2e.yml logs backend-e2e > docker-logs/backend.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs frontend-e2e > docker-logs/frontend.log 2>&1 || true
          docker compose -f docker-compose.e2e.yml logs postgres-e2e > docker-logs/postgres.log 2>&1 || true

      - name: Upload Docker Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-logs/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-images, e2e-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images Tested" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build-images.outputs.backend_image }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.build-images.outputs.frontend_image }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "These images are ready to be promoted to staging after merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ E2E tests failed. Check artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi
