openapi: 3.1.0
info:
  title: Causal DAG API
  description: API for viewing and editing causal directed acyclic graphs
  version: 1.0.0

paths:
  /api/simulations/{simulation_id}/dag:
    get:
      summary: Get causal DAG
      description: Retrieves the complete causal DAG including nodes, edges, assumptions, and risks
      operationId: get_dag
      tags:
        - DAG
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
        - name: version
          in: query
          description: Specific DAG version to retrieve (defaults to latest)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: DAG retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGResponse'
              examples:
                meal_subscription_dag:
                  summary: Meal subscription DAG example
                  value:
                    id: "dag_12345678"
                    simulation_id: "sim_a1b2c3d4"
                    nodes:
                      - id: "var_001"
                        name: "marketing_spend"
                        type: "observable"
                        scope: "world"
                        description: "Total marketing budget allocated"
                        controllability: "high"
                        is_intervention: false
                        is_outcome: false
                      - id: "var_002"
                        name: "brand_awareness"
                        type: "latent"
                        scope: "user"
                        description: "User's awareness of the brand"
                        controllability: "medium"
                        is_intervention: false
                        is_outcome: false
                      - id: "var_003"
                        name: "trial_signups"
                        type: "observable"
                        scope: "world"
                        description: "Number of users signing up for trial"
                        controllability: "none"
                        is_intervention: true
                        is_outcome: false
                      - id: "var_004"
                        name: "delivery_reliability"
                        type: "friction"
                        scope: "world"
                        description: "Percentage of on-time deliveries"
                        controllability: "medium"
                        is_intervention: false
                        is_outcome: false
                      - id: "var_005"
                        name: "adoption_rate"
                        type: "observable"
                        scope: "world"
                        description: "Percentage of trial users who adopt subscription"
                        controllability: "none"
                        is_intervention: false
                        is_outcome: true
                    edges:
                      - from: "var_001"
                        to: "var_002"
                        relationship_type: "causal"
                      - from: "var_002"
                        to: "var_003"
                        relationship_type: "causal"
                      - from: "var_003"
                        to: "var_005"
                        relationship_type: "causal"
                      - from: "var_004"
                        to: "var_005"
                        relationship_type: "moderating"
                    assumptions:
                      - assumption: "Marketing spend translates linearly to brand awareness"
                        rationale: "Simplifying assumption for initial model"
                        confidence: "medium"
                    risks:
                      - risk: "Delivery reliability may have non-linear impact"
                        impact: "medium"
                        mitigation: "Test sensitivity with different distributions"
                    is_validated: true
                    validation_errors: null
                    version: 1
                    created_at: "2026-01-26T10:00:15Z"
        '404':
          description: Simulation or DAG not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update DAG (nodes and edges)
      description: |
        Updates the causal DAG by adding/removing/modifying nodes and edges.
        Creates a new DAG version. Triggers revalidation and optionally re-simulation.
      operationId: update_dag
      tags:
        - DAG
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DAGUpdate'
            examples:
              add_regulatory_variable:
                summary: Add regulatory approval variable
                value:
                  nodes:
                    - id: "var_006"
                      name: "regulatory_approval_delay"
                      type: "friction"
                      scope: "world"
                      description: "Days delayed waiting for regulatory approval"
                      controllability: "low"
                      is_intervention: false
                      is_outcome: false
                  edges:
                    - from: "var_006"
                      to: "var_003"
                      relationship_type: "causal"
                  re_simulate: false
      responses:
        '200':
          description: DAG updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGResponse'
        '400':
          description: Invalid DAG structure (cycles, orphaned nodes, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGValidationError'
        '404':
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/simulations/{simulation_id}/dag/validate:
    post:
      summary: Validate DAG structure
      description: |
        Validates proposed DAG changes without persisting them.
        Checks for cycles, orphaned nodes, and logical inconsistencies.
      operationId: validate_dag
      tags:
        - DAG
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DAGUpdate'
      responses:
        '200':
          description: Validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGValidationResult'
              examples:
                valid:
                  value:
                    is_valid: true
                    errors: []
                    warnings: []
                invalid_cycle:
                  value:
                    is_valid: false
                    errors:
                      - code: "CYCLE_DETECTED"
                        message: "Cycle detected: var_005 -> var_003 -> var_005"
                        affected_nodes: ["var_003", "var_005"]
                    warnings: []
        '404':
          description: Simulation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/simulations/{simulation_id}/dag/versions:
    get:
      summary: List DAG versions
      description: Retrieves all versions of the DAG for this simulation
      operationId: list_dag_versions
      tags:
        - DAG
      parameters:
        - name: simulation_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
      responses:
        '200':
          description: List of DAG versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DAGVersionListResponse'

components:
  schemas:
    VariableNode:
      type: object
      required:
        - id
        - name
        - type
        - scope
        - description
        - controllability
        - is_intervention
        - is_outcome
      properties:
        id:
          type: string
          pattern: '^var_[0-9]+$'
          description: Unique variable ID
          example: "var_001"
        name:
          type: string
          maxLength: 200
          description: Human-readable variable name
          example: "marketing_spend"
        type:
          type: string
          enum: [observable, latent, friction, failure, process, temporal]
          description: Variable classification
        scope:
          type: string
          enum: [world, user]
          description: Whether variable is system-level or individual-level
        description:
          type: string
          maxLength: 1000
          description: Explanation of what this variable represents
        controllability:
          type: string
          enum: [none, low, medium, high]
          description: How much control we have over this variable
        is_intervention:
          type: boolean
          description: True if this is the intervention variable
        is_outcome:
          type: boolean
          description: True if this is a primary or secondary outcome

    CausalEdge:
      type: object
      required:
        - from
        - to
        - relationship_type
      properties:
        from:
          type: string
          description: Source variable ID
          example: "var_001"
        to:
          type: string
          description: Target variable ID
          example: "var_002"
        relationship_type:
          type: string
          enum: [causal, mediating, confounding, moderating]
          description: Type of causal relationship

    Assumption:
      type: object
      required:
        - assumption
        - rationale
        - confidence
      properties:
        assumption:
          type: string
          description: Declared assumption made in model
        rationale:
          type: string
          description: Why this assumption is necessary
        confidence:
          type: string
          enum: [low, medium, high]
          description: Confidence in this assumption

    Risk:
      type: object
      required:
        - risk
        - impact
        - mitigation
      properties:
        risk:
          type: string
          description: Identified risk or uncertainty
        impact:
          type: string
          enum: [low, medium, high]
          description: Potential impact of this risk
        mitigation:
          type: string
          description: How to address this risk

    DAGResponse:
      type: object
      required:
        - id
        - simulation_id
        - nodes
        - edges
        - assumptions
        - risks
        - is_validated
        - version
        - created_at
      properties:
        id:
          type: string
          pattern: '^dag_[a-f0-9]{8}$'
        simulation_id:
          type: string
          pattern: '^sim_[a-f0-9]{8}$'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/VariableNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/CausalEdge'
        assumptions:
          type: array
          items:
            $ref: '#/components/schemas/Assumption'
        risks:
          type: array
          items:
            $ref: '#/components/schemas/Risk'
        is_validated:
          type: boolean
          description: Whether DAG passed validation checks
        validation_errors:
          type: array
          items:
            type: string
          nullable: true
          description: Validation error messages if any
        version:
          type: integer
          minimum: 1
          description: DAG version number
        created_at:
          type: string
          format: date-time

    DAGUpdate:
      type: object
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/VariableNode'
          description: Complete list of nodes (replaces existing)
        edges:
          type: array
          items:
            $ref: '#/components/schemas/CausalEdge'
          description: Complete list of edges (replaces existing)
        assumptions:
          type: array
          items:
            $ref: '#/components/schemas/Assumption'
          description: Updated assumptions
        risks:
          type: array
          items:
            $ref: '#/components/schemas/Risk'
          description: Updated risks
        re_simulate:
          type: boolean
          default: false
          description: Whether to trigger re-simulation after update

    DAGValidationResult:
      type: object
      required:
        - is_valid
        - errors
        - warnings
      properties:
        is_valid:
          type: boolean
          description: Whether DAG is valid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: Blocking validation errors
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'
          description: Non-blocking warnings

    ValidationError:
      type: object
      properties:
        code:
          type: string
          enum: [CYCLE_DETECTED, ORPHANED_NODE, INVALID_EDGE, MISSING_INTERVENTION, MISSING_OUTCOME, DUPLICATE_NODE_ID]
          description: Error code
        message:
          type: string
          description: Human-readable error message
        affected_nodes:
          type: array
          items:
            type: string
          description: Node IDs involved in this error

    ValidationWarning:
      type: object
      properties:
        code:
          type: string
          enum: [MANY_ROOT_NODES, WEAK_CAUSAL_PATH, ISOLATED_CLUSTER]
          description: Warning code
        message:
          type: string
          description: Human-readable warning message
        affected_nodes:
          type: array
          items:
            type: string

    DAGValidationError:
      type: object
      properties:
        detail:
          type: string
          description: Error message
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    DAGVersionSummary:
      type: object
      properties:
        version:
          type: integer
        node_count:
          type: integer
        edge_count:
          type: integer
        created_at:
          type: string
          format: date-time
        changes_from_previous:
          type: string
          description: Summary of changes from previous version
          nullable: true

    DAGVersionListResponse:
      type: object
      properties:
        simulation_id:
          type: string
          pattern: '^sim_[a-f0-9]{8}$'
        current_version:
          type: integer
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DAGVersionSummary'

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message
        error_code:
          type: string
          description: Machine-readable error code
          nullable: true
