openapi: 3.1.0
info:
  title: Narrative Mechanism Configuration API
  version: 1.0.0
  description: API for mechanism definitions and narrative generation

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: mechanisms
    description: Mechanism definitions and options
  - name: narrative
    description: Narrative generation for experiments

paths:
  /mechanisms:
    get:
      operationId: listMechanisms
      tags: [mechanisms]
      summary: List all mechanism definitions with their options
      description: Returns all mechanisms with their text options, ordered by display_order
      responses:
        '200':
          description: List of mechanisms with options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MechanismListResponse'

  /mechanisms/feature-types:
    get:
      operationId: listFeatureTypes
      tags: [mechanisms]
      summary: List all feature types
      description: Returns all feature types with their amplified mechanisms
      responses:
        '200':
          description: List of feature types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureTypeListResponse'

  /experiments/generate-narrative:
    post:
      operationId: generateNarrative
      tags: [narrative]
      summary: Generate narrative with mechanism placeholders
      description: |
        Analyzes the feature description and generates a narrative text with
        placeholders for relevant mechanisms. The LLM infers feature types
        and selects appropriate mechanisms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateNarrativeRequest'
      responses:
        '200':
          description: Generated narrative with selected mechanisms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateNarrativeResponse'
        '422':
          description: Validation error (e.g., description too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: LLM generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Mechanism Schemas
    MechanismOption:
      type: object
      required: [id, label, value, display_order]
      properties:
        id:
          type: string
          format: uuid
          description: Unique option identifier
        label:
          type: string
          description: Display text for the option
          example: "totalmente reversível"
        value:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Numeric value mapped to this option
          example: 0.0
        display_order:
          type: integer
          description: Order in dropdown (ascending)
          example: 1

    MechanismDefinition:
      type: object
      required: [id, key, label_pt, description, options]
      properties:
        id:
          type: string
          format: uuid
          description: Unique mechanism identifier
        key:
          type: string
          description: Programmatic key
          example: "irreversibility"
        label_pt:
          type: string
          description: Portuguese label for display
          example: "Irreversibilidade"
        description:
          type: string
          description: Explanation of what this mechanism measures
          example: "Grau em que a ação não pode ser desfeita"
        options:
          type: array
          items:
            $ref: '#/components/schemas/MechanismOption'
          description: Available options for this mechanism

    MechanismListResponse:
      type: object
      required: [mechanisms]
      properties:
        mechanisms:
          type: array
          items:
            $ref: '#/components/schemas/MechanismDefinition'

    # Feature Type Schemas
    FeatureType:
      type: object
      required: [id, key, label_pt, amplifies_mechanisms]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: "financial"
        label_pt:
          type: string
          example: "Financeira"
        description:
          type: string
          nullable: true
          example: "Features que envolvem transações financeiras"
        amplifies_mechanisms:
          type: array
          items:
            type: string
          description: List of mechanism keys this type amplifies
          example: ["irreversibility", "institutional_trust"]

    FeatureTypeListResponse:
      type: object
      required: [feature_types]
      properties:
        feature_types:
          type: array
          items:
            $ref: '#/components/schemas/FeatureType'

    # Narrative Generation Schemas
    GenerateNarrativeRequest:
      type: object
      required: [name, hypothesis]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Feature name
          example: "Pix via WhatsApp"
        hypothesis:
          type: string
          minLength: 10
          maxLength: 500
          description: Hypothesis to test
          example: "Usuários preferem pagar pelo app de mensagens"
        description:
          type: string
          maxLength: 2000
          nullable: true
          description: Additional context
          example: "Permite enviar dinheiro para contatos do WhatsApp sem sair do app"

    SelectedMechanism:
      type: object
      required: [key, default_option_id]
      properties:
        key:
          type: string
          description: Mechanism key
          example: "irreversibility"
        default_option_id:
          type: string
          format: uuid
          description: UUID of the default option chosen by LLM

    GenerateNarrativeResponse:
      type: object
      required: [inferred_types, narrative_template, selected_mechanisms, excluded_mechanisms]
      properties:
        inferred_types:
          type: array
          items:
            type: string
          description: Feature types inferred by LLM
          example: ["financial", "social"]
        narrative_template:
          type: string
          description: Narrative text with {mechanism_key} placeholders
          example: "O Pix via WhatsApp permite transferências... A transação é {irreversibility} após confirmada."
        selected_mechanisms:
          type: array
          items:
            $ref: '#/components/schemas/SelectedMechanism'
          description: Mechanisms selected as relevant (2-4)
        excluded_mechanisms:
          type: array
          items:
            type: string
          description: Mechanism keys deemed not relevant
          example: ["learning_curve", "habit_displacement"]

    # Error Schemas
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Error message
          example: "Falha na geração de narrativa. Tente novamente."
