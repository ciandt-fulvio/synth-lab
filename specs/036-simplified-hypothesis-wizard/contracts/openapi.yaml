openapi: 3.0.3
info:
  title: Simplified Hypothesis Wizard API
  description: |
    API contracts for the simplified hypothesis selection wizard feature.
    Provides guided hypothesis generation with scenario profiles and qualitative clarification questions.
  version: 1.0.0
  contact:
    name: synth-lab Development Team

servers:
  - url: http://localhost:8000/api
    description: Local development
  - url: https://staging.synth-lab.com/api
    description: Staging environment
  - url: https://api.synth-lab.com/api
    description: Production environment

paths:
  /simulations/{simulation_id}/hypotheses/wizard/init:
    post:
      summary: Initialize hypothesis wizard with scenario profile
      description: |
        Generates baseline hypotheses for all DAG variables using the selected scenario profile
        (Conservative/Realistic/Optimistic). Returns generated hypotheses and 3-5 clarification
        questions for critical variables.

        Prerequisites:
        - Simulation must exist
        - CausalDAG must be validated and associated with simulation

        Side effects:
        - Creates/updates hypotheses in database
        - Does NOT persist scenario profile or clarification questions (in-memory state)
      operationId: initializeHypothesisWizard
      tags:
        - Hypothesis Wizard
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Simulation ID (format sim_XXXXXXXX)
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
            example: sim_12345678
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardInitRequest'
            examples:
              conservative:
                summary: Conservative scenario
                value:
                  scenario_profile: conservative
              realistic:
                summary: Realistic scenario (default)
                value:
                  scenario_profile: realistic
              optimistic:
                summary: Optimistic scenario
                value:
                  scenario_profile: optimistic
      responses:
        '200':
          description: Wizard initialized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardInitResponse'
              examples:
                simple_dag:
                  summary: Simple DAG (3 clarification questions)
                  value:
                    hypotheses:
                      - id: hyp_a1b2c3d4
                        simulation_id: sim_12345678
                        variable_name: conversion_rate
                        distribution_type: beta
                        distrib_params:
                          alpha: 15.0
                          beta: 85.0
                        range_min: 0.0
                        range_max: 1.0
                        correlations: null
                        scenario_options: null
                        selected_scenario: null
                        created_at: '2026-01-28T10:00:00Z'
                        updated_at: '2026-01-28T10:00:00Z'
                    clarification_questions:
                      - variable_name: conversion_rate
                        question_text: Conversion rate is more common or more rare in your context?
                        criticality_score: 8.5
                      - variable_name: churn_rate
                        question_text: Churn rate is more common or more rare in your context?
                        criticality_score: 7.2
                      - variable_name: acquisition_cost
                        question_text: Acquisition cost tends to be higher or lower than average?
                        criticality_score: 6.8
        '404':
          description: Simulation or CausalDAG not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Simulation sim_12345678 not found
        '422':
          description: Validation error (invalid scenario profile or DAG not validated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: CausalDAG must be validated before running hypothesis wizard
        '500':
          description: Internal server error (LLM failure, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /simulations/{simulation_id}/hypotheses/wizard/clarify:
    post:
      summary: Apply clarification responses to hypotheses
      description: |
        Adjusts hypothesis distributions based on user's qualitative responses to clarification
        questions. Each response ("more"/"less"/"equal"/"don't know") modifies distribution
        parameters according to predefined adjustment rules.

        Prerequisites:
        - Wizard must be initialized (hypotheses must exist)
        - Clarification questions must have been generated

        Side effects:
        - Updates hypotheses in database with adjusted distributions
        - Does NOT persist clarification responses (in-memory state)
      operationId: applyHypothesisClarifications
      tags:
        - Hypothesis Wizard
      parameters:
        - name: simulation_id
          in: path
          required: true
          description: Simulation ID (format sim_XXXXXXXX)
          schema:
            type: string
            pattern: '^sim_[a-f0-9]{8}$'
            example: sim_12345678
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WizardClarifyRequest'
            examples:
              partial_responses:
                summary: User answers some questions
                value:
                  responses:
                    - variable_name: conversion_rate
                      response: more
                    - variable_name: churn_rate
                      response: less
              skip_questions:
                summary: User skips all questions (empty responses)
                value:
                  responses: []
      responses:
        '200':
          description: Clarifications applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WizardClarifyResponse'
              examples:
                adjusted_hypotheses:
                  summary: Hypotheses adjusted based on responses
                  value:
                    hypotheses:
                      - id: hyp_a1b2c3d4
                        simulation_id: sim_12345678
                        variable_name: conversion_rate
                        distribution_type: beta
                        distrib_params:
                          alpha: 19.5
                          beta: 68.0
                        range_min: 0.0
                        range_max: 1.0
                        correlations: null
                        scenario_options: null
                        selected_scenario: null
                        created_at: '2026-01-28T10:00:00Z'
                        updated_at: '2026-01-28T10:05:00Z'
        '404':
          description: Simulation or hypotheses not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error (invalid response type or variable not found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Variable 'invalid_var' not found in simulation DAG
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    WizardInitRequest:
      type: object
      required:
        - scenario_profile
      properties:
        scenario_profile:
          $ref: '#/components/schemas/ScenarioProfile'
      example:
        scenario_profile: realistic

    ScenarioProfile:
      type: string
      enum:
        - conservative
        - realistic
        - optimistic
      description: |
        Predefined scenario profile for hypothesis generation:
        - conservative: Worse-than-average outcomes, higher uncertainty
        - realistic: Market-average parameters (default)
        - optimistic: Better-than-average outcomes, lower uncertainty

    WizardInitResponse:
      type: object
      required:
        - hypotheses
        - clarification_questions
      properties:
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/Hypothesis'
          description: Generated hypotheses for all DAG variables with profile-adjusted parameters
        clarification_questions:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationQuestion'
          description: 3-5 questions about critical variables (may be empty if all variables have low uncertainty)
          minItems: 0
          maxItems: 5

    ClarificationQuestion:
      type: object
      required:
        - variable_name
        - question_text
        - criticality_score
      properties:
        variable_name:
          type: string
          description: Variable identifier from DAG
          example: conversion_rate
        question_text:
          type: string
          description: Plain-language question asking about frequency or magnitude
          example: Conversion rate is more common or more rare in your context?
        criticality_score:
          type: number
          format: float
          description: Ranking score (impact × uncertainty) - higher is more critical
          example: 8.5
          minimum: 0

    WizardClarifyRequest:
      type: object
      required:
        - responses
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/ClarificationResponse'
          description: User responses to clarification questions (may be partial or empty)
          maxItems: 5
      example:
        responses:
          - variable_name: conversion_rate
            response: more
          - variable_name: churn_rate
            response: dont_know

    ClarificationResponse:
      type: object
      required:
        - variable_name
        - response
      properties:
        variable_name:
          type: string
          description: Variable identifier from DAG (must match clarification question)
          example: conversion_rate
        response:
          $ref: '#/components/schemas/ResponseType'

    ResponseType:
      type: string
      enum:
        - more
        - less
        - equal
        - dont_know
      description: |
        Qualitative response options:
        - more: Higher frequency/magnitude than expected (shifts mean up, reduces variance)
        - less: Lower frequency/magnitude than expected (shifts mean down, reduces variance)
        - equal: Matches expectation (keeps profile defaults unchanged)
        - dont_know: High uncertainty (keeps mean, increases variance)

    WizardClarifyResponse:
      type: object
      required:
        - hypotheses
      properties:
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/Hypothesis'
          description: Updated hypotheses with clarification adjustments applied

    Hypothesis:
      type: object
      required:
        - id
        - simulation_id
        - variable_name
        - distribution_type
        - distrib_params
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^hyp_[a-f0-9]{8}$'
          description: Hypothesis ID (format hyp_XXXXXXXX)
          example: hyp_a1b2c3d4
        simulation_id:
          type: string
          pattern: '^sim_[a-f0-9]{8}$'
          description: Parent simulation ID
          example: sim_12345678
        variable_name:
          type: string
          description: Variable identifier from DAG
          example: conversion_rate
        distribution_type:
          $ref: '#/components/schemas/DistributionType'
        distrib_params:
          type: object
          description: Distribution parameters (schema depends on distribution_type)
          oneOf:
            - $ref: '#/components/schemas/NormalParams'
            - $ref: '#/components/schemas/UniformParams'
            - $ref: '#/components/schemas/BetaParams'
            - $ref: '#/components/schemas/LogNormalParams'
            - $ref: '#/components/schemas/BernoulliParams'
            - $ref: '#/components/schemas/TriangularParams'
        range_min:
          type: number
          format: float
          nullable: true
          description: Hard lower bound (clamp distribution samples)
          example: 0.0
        range_max:
          type: number
          format: float
          nullable: true
          description: Hard upper bound (clamp distribution samples)
          example: 1.0
        correlations:
          type: array
          items:
            $ref: '#/components/schemas/Correlation'
          nullable: true
          description: Correlations with other variables
        scenario_options:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioOption'
          nullable: true
          description: NOT populated by wizard (reserved for manual editor)
        selected_scenario:
          type: string
          nullable: true
          description: NOT populated by wizard
        created_at:
          type: string
          format: date-time
          example: '2026-01-28T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-01-28T10:05:00Z'

    DistributionType:
      type: string
      enum:
        - normal
        - uniform
        - beta
        - lognormal
        - bernoulli
        - triangular

    NormalParams:
      type: object
      required:
        - mu
        - sigma
      properties:
        mu:
          type: number
          format: float
          description: Mean
          example: 0.5
        sigma:
          type: number
          format: float
          description: Standard deviation
          example: 0.1

    UniformParams:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: number
          format: float
          example: 0.0
        max:
          type: number
          format: float
          example: 1.0

    BetaParams:
      type: object
      required:
        - alpha
        - beta
      properties:
        alpha:
          type: number
          format: float
          description: Success shape parameter
          example: 15.0
        beta:
          type: number
          format: float
          description: Failure shape parameter
          example: 85.0

    LogNormalParams:
      type: object
      required:
        - mu
        - sigma
      properties:
        mu:
          type: number
          format: float
          description: Mean of log
          example: 1.5
        sigma:
          type: number
          format: float
          description: Standard deviation of log
          example: 0.5

    BernoulliParams:
      type: object
      required:
        - p
      properties:
        p:
          type: number
          format: float
          description: Success probability
          example: 0.3
          minimum: 0
          maximum: 1

    TriangularParams:
      type: object
      required:
        - min
        - mode
        - max
      properties:
        min:
          type: number
          format: float
          example: 0.0
        mode:
          type: number
          format: float
          description: Most likely value
          example: 0.5
        max:
          type: number
          format: float
          example: 1.0

    Correlation:
      type: object
      required:
        - with_variable
        - coefficient
      properties:
        with_variable:
          type: string
          description: Variable name to correlate with
          example: churn_rate
        coefficient:
          type: number
          format: float
          description: Correlation coefficient (-1 to 1)
          example: -0.7
          minimum: -1
          maximum: 1

    ScenarioOption:
      type: object
      description: NOT used by wizard (reserved for manual editor controllable variables)

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Human-readable error message
          example: Simulation sim_12345678 not found

tags:
  - name: Hypothesis Wizard
    description: Guided hypothesis generation with scenario profiles and qualitative clarification
