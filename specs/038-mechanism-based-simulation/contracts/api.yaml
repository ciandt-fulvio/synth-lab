# API Contracts: Mechanism-Based Simulation
# Feature: 038-mechanism-based-simulation
# Date: 2026-02-04
#
# Note: These are ADDITIONS/MODIFICATIONS to existing API contracts.
# Existing endpoints remain unchanged for backward compatibility.

openapi: 3.1.0
info:
  title: Synth-Lab Mechanism-Based Simulation API Extensions
  version: 1.0.0
  description: |
    API extensions for mechanism-based Monte Carlo simulation.
    All changes are backward compatible with existing experiments.

paths:
  # MODIFIED: Existing endpoint with extended schema
  /experiments/{experiment_id}:
    patch:
      summary: Update experiment (extended with mechanisms)
      description: |
        Updates experiment details including scorecard and feature mechanisms.
        Mechanisms are optional - if not provided, defaults to all zeros.
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
            pattern: ^exp_[a-f0-9]{8}$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExperimentRequest'
      responses:
        '200':
          description: Experiment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        '400':
          description: Invalid mechanism values
        '404':
          description: Experiment not found

  # MODIFIED: Run analysis with mechanism support
  /analysis/{experiment_id}/run:
    post:
      summary: Run analysis (mechanism-aware)
      description: |
        Runs Monte Carlo simulation with mechanism×sensitivity interactions.
        If mechanisms are defined on scorecard, uses mechanism-based calculations.
        If no mechanisms, falls back to scorecard-only behavior.
      parameters:
        - name: experiment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunAnalysisRequest'
      responses:
        '200':
          description: Analysis started/completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'

  # NEW: Same-world feature comparison
  /analysis/compare:
    post:
      summary: Compare features in same world
      description: |
        Compares multiple features against the same "world" (identical user states).
        Enables fair A/B comparison by controlling for user variation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SameWorldCompareRequest'
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SameWorldCompareResponse'
        '400':
          description: Invalid request (e.g., experiments have different synth groups)

  # NEW: Get mechanism explanation for segment
  /analysis/{analysis_id}/explain-segment:
    post:
      summary: Explain segment differences via mechanism interactions
      description: |
        Returns the top mechanism×sensitivity interactions that explain
        why a specific segment has different outcomes.
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainSegmentRequest'
      responses:
        '200':
          description: Segment explanation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentExplanationResponse'

components:
  schemas:
    # NEW: Feature mechanisms input
    FeatureMechanismsInput:
      type: object
      description: Feature mechanism intensities (all optional, default 0.0)
      properties:
        irreversibility:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which actions are permanent/irreversible
        network_effect:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which value depends on others using it
        institutional_trust:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which feature requires trust in institution
        habit_displacement:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which feature replaces existing habits
        learning_curve:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which feature requires learning new skills
        social_visibility:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Degree to which usage is visible to others

    # NEW: User sensitivities output
    UserSensitivitiesOutput:
      type: object
      description: User sensitivity values (all in [0,1], default 0.5)
      properties:
        risk_aversion:
          type: number
          minimum: 0
          maximum: 1
        social_dependency:
          type: number
          minimum: 0
          maximum: 1
        institutional_trust_level:
          type: number
          minimum: 0
          maximum: 1
        habit_plasticity:
          type: number
          minimum: 0
          maximum: 1
        learning_tolerance:
          type: number
          minimum: 0
          maximum: 1
        social_influence:
          type: number
          minimum: 0
          maximum: 1

    # NEW: Interaction contribution for explainability
    InteractionContribution:
      type: object
      required:
        - mechanism
        - sensitivity
        - product
      properties:
        mechanism:
          type: string
          enum: [irreversibility, network_effect, institutional_trust, habit_displacement, learning_curve, social_visibility]
        sensitivity:
          type: string
          enum: [risk_aversion, social_dependency, institutional_trust_level, habit_plasticity, learning_tolerance, social_influence]
        product:
          type: number
          description: mechanism_value × sensitivity_value

    # NEW: Emergent state explanation
    EmergentExplanation:
      type: object
      properties:
        top_contributors:
          type: array
          items:
            $ref: '#/components/schemas/InteractionContribution'
          maxItems: 5
        perceived_risk_delta:
          type: number
          description: Change to perceived risk from mechanisms
        initial_effort_delta:
          type: number
          description: Change to initial effort from mechanisms

    # EXTENDED: UpdateExperimentRequest with mechanisms
    UpdateExperimentRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        hypothesis:
          type: string
          maxLength: 500
        description:
          type: string
        scorecard:
          $ref: '#/components/schemas/ScorecardInput'
        mechanisms:
          $ref: '#/components/schemas/FeatureMechanismsInput'
        feature_types:
          type: array
          items:
            type: string
          description: Optional category tags (e.g., financial, social, utility)

    # EXTENDED: ScorecardInput (unchanged, shown for reference)
    ScorecardInput:
      type: object
      properties:
        complexity:
          $ref: '#/components/schemas/DimensionInput'
        initial_effort:
          $ref: '#/components/schemas/DimensionInput'
        perceived_risk:
          $ref: '#/components/schemas/DimensionInput'
        time_to_value:
          $ref: '#/components/schemas/DimensionInput'

    DimensionInput:
      type: object
      required:
        - score
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        rules_applied:
          type: array
          items:
            type: string
        min_uncertainty:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        max_uncertainty:
          type: number
          minimum: 0
          maximum: 1
          default: 0

    # NEW: Same-world comparison request
    SameWorldCompareRequest:
      type: object
      required:
        - experiment_ids
        - seed
      properties:
        experiment_ids:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 5
          description: Experiments to compare (must share same synth group)
        seed:
          type: integer
          description: Random seed for reproducible world generation
        n_executions:
          type: integer
          default: 100
          minimum: 10
          maximum: 1000
        scenario_id:
          type: string
          description: Optional scenario to apply to all features

    # NEW: Same-world comparison response
    SameWorldCompareResponse:
      type: object
      properties:
        world_seed:
          type: integer
        synth_count:
          type: integer
        n_executions:
          type: integer
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/FeatureComparisonResult'
        summary:
          type: object
          properties:
            best_feature_id:
              type: string
            best_success_rate:
              type: number
            variance_between_features:
              type: number
              description: Standard deviation of success rates across features

    # NEW: Single feature comparison result
    FeatureComparisonResult:
      type: object
      properties:
        experiment_id:
          type: string
        feature_name:
          type: string
        aggregated_success:
          type: number
        aggregated_failed:
          type: number
        aggregated_did_not_try:
          type: number
        mechanisms_used:
          $ref: '#/components/schemas/FeatureMechanismsInput'
        top_mechanism_effects:
          type: array
          items:
            $ref: '#/components/schemas/InteractionContribution'
          description: Top 3 mechanism×sensitivity effects across population

    # NEW: Segment explanation request
    ExplainSegmentRequest:
      type: object
      required:
        - synth_ids
      properties:
        synth_ids:
          type: array
          items:
            type: string
          description: Synths in the segment to explain
        compare_to_population:
          type: boolean
          default: true
          description: Whether to compare segment to full population

    # NEW: Segment explanation response
    SegmentExplanationResponse:
      type: object
      properties:
        segment_size:
          type: integer
        segment_avg_success:
          type: number
        population_avg_success:
          type: number
        top_differentiating_factors:
          type: array
          items:
            type: object
            properties:
              interaction:
                $ref: '#/components/schemas/InteractionContribution'
              segment_avg:
                type: number
              population_avg:
                type: number
              delta:
                type: number
        explanation_text:
          type: string
          description: Human-readable explanation of segment differences

    # EXTENDED: ExperimentResponse with mechanisms
    ExperimentResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hypothesis:
          type: string
        description:
          type: string
        synth_group_id:
          type: string
        scorecard:
          $ref: '#/components/schemas/ScorecardOutput'
        mechanisms:
          $ref: '#/components/schemas/FeatureMechanismsInput'
        feature_types:
          type: array
          items:
            type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Reference: Existing schemas
    ScorecardOutput:
      type: object
      # ... existing structure unchanged

    RunAnalysisRequest:
      type: object
      properties:
        n_synths:
          type: integer
          default: 500
        n_executions:
          type: integer
          default: 100
        sigma:
          type: number
          default: 0.05
        seed:
          type: integer
        scenario_id:
          type: string

    AnalysisResponse:
      type: object
      # ... existing structure unchanged
