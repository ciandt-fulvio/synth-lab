[project]
name = "synth-lab"
version = "0.2.6"
description = "Gerador de personas sintéticas (Synths) brasileiras com atributos demográficos, psicográficos e comportamentais realistas"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=21.0.0",
    "jsonschema>=4.20.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0",
    "openai>=2.8.0",
    "openai-agents>=0.0.16",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "pdfplumber>=0.11.0",
    "tenacity>=8.0.0",
    # REST API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    # Simulation (Monte Carlo, region analysis, causal graphs)
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.0",
    "kneed>=0.8.0", # Knee point detection for elbow method
    # Observability (Phoenix/OpenTelemetry)
    "arize-phoenix>=5.0.0",
    "arize-phoenix-otel>=0.6.0",
    "openinference-instrumentation-openai>=0.1.0",
    "openinference-instrumentation-openai-agents>=0.1.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    # Database ORM and Migrations
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    # S3 Storage (Railway Buckets / AWS compatible)
    "boto3>=1.34.0",
    # Media processing for thumbnails and descriptions
    "pdf2image>=1.17.0",
    "moviepy>=1.0.3",
    "pytesseract>=0.3.10", # OCR for PDF text extraction
    "authlib>=1.6.6",
    "python-jose>=3.5.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.8.0",  # Parallel test execution
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
]

[project.scripts]
synthlab = "synth_lab.__main__:main"

[tool.uv]
prerelease = "allow"
environments = ["python_version >= '3.13' and python_version < '3.14'"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
synth_lab = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/synth_lab/services/simulation/dag_constructor_service.py" = ["E501"]
"src/synth_lab/services/quantitative_analysis_service.py" = ["E501"]
"src/synth_lab/services/dag_generator.py" = ["E501"]
"tests/integration/test_quantitative_analysis_*.py" = ["E501"]
"tests/unit/test_simulation_engine.py" = ["E501"]
"tests/unit/test_simulation_run_entity.py" = ["E501"]
"tests/unit/test_uservar_extractors.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "smoke: marks smoke tests (critical paths only)",
    "contract: marks API contract tests",
    "contract_live: marks API contract tests requiring a running backend",
    "schema: marks schema validation tests",
    "requires_postgres: marks tests requiring PostgreSQL",
    "real_api: marks tests that make REAL API calls (OpenAI, S3, etc) - incurs costs",
    "e2e: marks end-to-end tests",
]
# Default test discovery patterns
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Parallel execution (can be overridden with -n 0 to disable)
# Note: Use -n auto to automatically detect CPU cores
# Use -n 0 to disable parallelization (needed for debugging)
addopts = "--strict-markers --tb=short"
# Asyncio mode
asyncio_mode = "auto"
