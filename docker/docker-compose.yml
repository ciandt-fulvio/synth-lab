# synth-lab Docker Compose Configuration
#
# Usage:
#   Development:  docker compose --profile dev up
#   Testing:      docker compose --profile test up
#   Both:         docker compose --profile dev --profile test up
#
# Environment files:
#   docker/.env.dev  - Development environment
#   docker/.env.test - Testing environment

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  synthlab-dev:
    driver: bridge
    name: synthlab-dev-network

  synthlab-test:
    driver: bridge
    name: synthlab-test-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-dev-data:
    driver: local
    name: synthlab-postgres-dev-data

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ===========================================================================
  # DEVELOPMENT PROFILE SERVICES
  # ===========================================================================

  # PostgreSQL for development (with persistent volume)
  postgres-dev:
    image: postgres:14-alpine
    container_name: synthlab-postgres-dev
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthlab}
      POSTGRES_DB: ${POSTGRES_DB:-synthlab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthlab} -d ${POSTGRES_DB:-synthlab}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synthlab-dev

  # Backend for development (with hot reload)
  backend-dev:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
    container_name: synthlab-backend-dev
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synthlab}:${POSTGRES_PASSWORD:-synthlab}@postgres-dev:5432/${POSTGRES_DB:-synthlab}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PHOENIX_ENABLED: ${PHOENIX_ENABLED:-true}
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://localhost:6006}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      WATCHFILES_FORCE_POLLING: "true"
      # S3 Storage (Railway Buckets)
      ENDPOINT: ${ENDPOINT}
      BUCKET: ${BUCKET}
      BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      REGION: ${REGION}
      # JWT Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      # Access Control
      WHITELIST: ${WHITELIST}
      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src:cached
      - ../data:/app/data:ro
    depends_on:
      postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - synthlab-dev
    tty: true

  # Frontend for development (with HMR)
  frontend-dev:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: synthlab-frontend-dev
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      VITE_PORT: "8080"
      VITE_API_PORT: "8000"
      VITE_BACKEND_HOST: backend-dev
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend-dev:
        condition: service_healthy
    networks:
      - synthlab-dev
    tty: true
    stop_grace_period: 1s

  # ===========================================================================
  # TEST PROFILE SERVICES
  # ===========================================================================

  # PostgreSQL for testing (ephemeral - no persistent volume)
  postgres-test:
    image: postgres:14-alpine
    container_name: synthlab-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: synthlab
      POSTGRES_PASSWORD: synthlab
      POSTGRES_DB: synthlab
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthlab -d synthlab"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synthlab-test

  # Backend for testing (production build, no volume mounts)
  backend-test:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: synthlab-backend-test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql://synthlab:synthlab@postgres-test:5432/synthlab
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy_key_for_testing}
      PHOENIX_ENABLED: "false"
      LOG_LEVEL: INFO
      # S3 Storage (Railway Buckets)
      ENDPOINT: ${ENDPOINT}
      BUCKET: ${BUCKET}
      BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
      BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
      REGION: ${REGION}
      # Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-test-secret-key-for-e2e-testing}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-client-secret}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:8001/api/v1/auth/callback}
    # Override entrypoint to include test data seeding
    command: >
      sh -c "
      echo 'Running Alembic migrations...' &&
      alembic -c src/synth_lab/alembic/alembic.ini upgrade head &&
      echo 'Seeding test data...' &&
      DATABASE_URL=postgresql://synthlab:synthlab@postgres-test:5432/synthlab uv run python -m tests.fixtures.seed_test &&
      echo 'Starting server...' &&
      exec uvicorn synth_lab.api.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8001:8000"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - synthlab-test

  # Frontend for testing (production build, no volume mounts)
  # VITE_API_URL points to backend on host (for Playwright running on host)
  frontend-test:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:8001"
    container_name: synthlab-frontend-test
    profiles: ["test"]
    environment:
      PORT: "8080"
    ports:
      - "8091:8080"
    depends_on:
      backend-test:
        condition: service_healthy
    networks:
      - synthlab-test

  # ===========================================================================
  # OPTIONAL: Admin tools
  # ===========================================================================

  # pgAdmin (database management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: synthlab-pgadmin
    profiles: ["admin"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@synthlab.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - synthlab-dev
