# E2E Testing Docker Compose
#
# Supports two modes:
#   1. Build mode (default): Builds images locally
#      make test-e2e
#
#   2. Registry mode: Uses pre-built images from GHCR
#      BACKEND_IMAGE=ghcr.io/owner/synth-lab-api:sha123 \
#      FRONTEND_IMAGE=ghcr.io/owner/synth-lab-frontend:sha123 \
#      docker compose -f docker-compose.e2e.yml up
#
# Environment variables:
#   BACKEND_IMAGE  - If set, uses this image instead of building
#   FRONTEND_IMAGE - If set, uses this image instead of building
#   OPENAI_API_KEY - Required for backend

version: '3.8'

services:
  # PostgreSQL database for E2E tests
  postgres-e2e:
    image: postgres:14-alpine
    container_name: synthlab-postgres-e2e
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: synthlab_e2e
      POSTGRES_USER: synthlab_e2e
      POSTGRES_PASSWORD: synthlab_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthlab_e2e"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data

  # Backend API server
  # Uses BACKEND_IMAGE if provided, otherwise builds from Dockerfile.backend
  backend-e2e:
    image: ${BACKEND_IMAGE:-synth-lab-backend-e2e}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: synthlab-backend-e2e
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://synthlab_e2e:synthlab_e2e@postgres-e2e:5432/synthlab_e2e
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PHOENIX_ENABLED: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8091}
      # CORS: Allow E2E frontend origin for cross-origin API calls
      CORS_ORIGINS: "http://localhost:8091,http://localhost:8080,http://localhost:5173"
      # Enable test environment for test-login endpoint
      ENVIRONMENT: "test"
    depends_on:
      postgres-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-network

  # Frontend React app
  # Uses FRONTEND_IMAGE if provided, otherwise builds from frontend/Dockerfile
  frontend-e2e:
    image: ${FRONTEND_IMAGE:-synth-lab-frontend-e2e}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
    container_name: synthlab-frontend-e2e
    ports:
      - "8091:3000"
    environment:
      PORT: "3000"
    depends_on:
      backend-e2e:
        condition: service_healthy
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge

volumes:
  postgres-e2e-data:
